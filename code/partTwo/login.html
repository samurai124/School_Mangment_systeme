<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ENAA Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #0d6efd;
            padding: 12px;
            font-weight: 600;
        }
        .logo-text {
            color: #0d6efd;
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 p-md-5">
        <div class="card-body">
            <div class="text-center mb-4">
                <h2 class="logo-text h3">ENAA</h2>
                <p class="text-muted">Espace Apprenant</p>
            </div>

            <form id="loginForm" action="dashboard.html">
                <div class="mb-3">
                    <label for="identifiant" class="form-label">Identifiant</label>
                    <input type="text" class="form-control form-control-lg" id="identifiant" placeholder="Nom" required>
                </div>

                <div class="d-grid">
                    <button id="login" type="submit" class="btn btn-primary btn-lg rounded-3">Se connecter</button>
                </div>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
